<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulwark</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css?v=1.8.0">
</head>
<body>
<div class="shell">
  <aside class="rail" aria-label="Bulwark">
    <a class="brand" href="#/"><img src="logo.svg" alt=""><span>Bulwark</span></a>
    <a class="backhost" id="backHost" href="/" hidden title="Back to your Aegis dashboard"><i data-i="back"></i><span>Aegis dashboard</span></a>
    <nav id="nav">
      <a href="#/" data-v="overview"><i data-i="grid"></i><span>Overview</span></a>
      <a href="#/log" data-v="log"><i data-i="list"></i><span>Live log</span><b class="livedot" id="liveDot"></b></a>
      <a href="#/waves" data-v="waves"><i data-i="wave"></i><span>Waves</span><b class="badge" id="waveBadge" hidden></b></a>
      <a href="#/patterns" data-v="patterns"><i data-i="graph"></i><span>Patterns</span></a>
      <a href="#/inspect" data-v="inspect"><i data-i="search"></i><span>Inspector</span></a>
      <a href="#/devices" data-v="devices"><i data-i="device"></i><span>Devices</span><b class="count" id="devCount"></b></a>
      <a href="#/addresses" data-v="addresses"><i data-i="ban"></i><span>Blocklist</span><b class="count" id="banCount"></b></a>
      <a href="#/lists" data-v="lists"><i data-i="layers"></i><span>Lists</span></a>
      <a href="#/vendors" data-v="vendors"><i data-i="send"></i><span>Vendors</span></a>
      <a href="#/settings" data-v="settings"><i data-i="gear"></i><span>Settings</span></a>
    </nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <main id="app" tabindex="-1"></main>
</div>
<div class="pop" id="pop" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-in" id="drawerIn"></div></aside>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="app.js?v=1.8.0"></script>
</body>
</html>
